# Apache virtual host.
#
# Point DocumentRoot at public/ where you can. The root .htaccess only exists
# for shared hosting where you cannot.

<VirtualHost *:443>
    ServerName example.com

    DocumentRoot /var/www/wirasat/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    <Directory /var/www/wirasat/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Nothing outside public/ is served.
    <Directory /var/www/wirasat>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/wirasat-error.log
    CustomLog ${APACHE_LOG_DIR}/wirasat-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>
